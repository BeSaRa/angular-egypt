<!--suppress HtmlUnknownTag, HtmlDeprecatedAttribute -->
<div class="bg-white mt-20 w-[500px] max-w-full min-h-[400px] mx-auto rounded-2xl flex flex-col shadow-2xl p-4">
  <div [formGroup]="form" class="flex gap-4 items-center">
    <label for="todo" class="flex-auto flex flex-col">
      <span>Title:</span>
      <input (keydown.enter)="save()" formControlName="title" type="text" id="todo"
             class="border-2 border-gray-300 rounded-lg p-2 mb-2 focus:outline-none focus:border-blue-500">
    </label>
    <label for="privacy" class="flex flex-col">
      <span>Privacy:</span>
      <select (keydown.enter)="save()" formControlName="lookupId" id="privacy"
              class="border-2 border-gray-300 rounded-lg p-2 mb-2 focus:outline-none focus:border-blue-500">
        <button>@if (true) {
          <selectedcontent></selectedcontent>
        }</button>
        @for (lookup of lookups(); track lookup.id) {
          <option [value]="lookup.id">
            <ng-container [ngTemplateOutlet]="lookupName(lookup.name)"></ng-container>
            <span>{{ lookup.name }}</span>
          </option>
        }
      </select>
    </label>
    <div class="flex gap-2">
      <button [disabled]="isEmpty()" (click)="cancel()" id="cancel-edit"
              class="cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed mt-4">
        <svg class="size-6" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
          <path
            d="M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path>
        </svg>
      </button>
      <button (click)="save()" id="cancel-edit"
              class="cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed mt-4">
        <svg class="size-6" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256">
          <path
            d="M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path>
        </svg>
      </button>
    </div>
  </div>
  <span class="text-gray-500 text-xs">click <code class="bg-gray-600 text-white rounded-md px-1">Enter</code> to add/update todo </span>
  <ul id="todo-container" class="[&>li]:border-b-[1px] [&>li]:border-gray-200 [&>li:last-child]:border-none">
    @for (todo of todos(); track $index) {
      <li animate.leave="leave" animate.enter="enter" [class.edit-mode]="inEditMode(todo)" class="py-3 flex justify-between">
        <label class="flex gap-2 items-center cursor-pointer">
          <input [disabled]="inEditMode(todo)" class="size-6 focus:outline-blue-500 accent-cyan-600 peer"
                 type="checkbox">
          <span class="text-gray-600 peer-checked:line-through">{{ todo.title }}</span>
          <span
            class="rounded-md p-1 text-xs {{lookupMap()[todo.lookupId].name}}">{{ lookupMap()[todo.lookupId].name }}</span>
        </label>
        <div class="flex gap-2">
          <button [disabled]="editItem" (click)="editTodo(todo)" class="group cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-6 fill-cyan-900 group-disabled:opacity-50"
                 viewBox="0 0 256 256">
              <path
                d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM51.31,160,136,75.31,152.69,92,68,176.68ZM48,179.31,76.69,208H48Zm48,25.38L79.31,188,164,103.31,180.69,120Zm96-96L147.31,64l24-24L216,84.68Z"></path>
            </svg>
          </button>
          <button [disabled]="editItem" (click)="deleteTodo(todo)" class="group cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-6 fill-red-500 group-disabled:opacity-50"
                 viewBox="0 0 256 256">
              <path
                d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"></path>
            </svg>
          </button>
        </div>
      </li>
    }
  </ul>
</div>
